@if (visible()) {
<div style="position:fixed;inset:0;z-index:2147483647;background:#fff;display:flex;align-items:center;justify-content:center;">
  <div style="position:relative;width:120px;height:120px;">
    <div style="position:absolute;inset:0;border-radius:50%;border:1px solid transparent;border-left-color:#128AA2;border-right-color:#128AA2;animation:ldSpin 1.5s linear infinite;"></div>
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
      <div style="width:80px;height:80px;border-radius:50%;background:rgba(0,0,0,0.80);display:flex;align-items:center;justify-content:center;padding:12px;box-sizing:border-box;">
        <img
          [src]="logo"
          alt="CENEFCO"
          fetchpriority="high"
          style="width:100%;height:100%;object-fit:contain;display:block;">
      </div>
    </div>
  </div>
</div>
}
