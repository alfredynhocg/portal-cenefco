
<div class="gm-overlay" [class.visible]="visible" (click)="cerrar()"></div>

<div class="gm-modal" [class.visible]="visible" role="dialog" aria-modal="true">

  <div class="gm-header">
    <div class="gm-title">
      <i class="fa-solid fa-images"></i>
      <span>{{ cursoNombre || 'Galería del Curso' }}</span>
    </div>
    <button type="button" class="gm-close" (click)="cerrar()" aria-label="Cerrar">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <ng-container *ngIf="imagenes.length > 0; else sinImagenes">

    <div class="gm-viewer">
      <button type="button" class="gm-nav gm-prev" (click)="anterior()" *ngIf="imagenes.length > 1">
        <i class="fa-solid fa-chevron-left"></i>
      </button>

      <div class="gm-img-wrap">
        <img [src]="imagenActiva" [alt]="cursoNombre" (click)="$event.stopPropagation()">
      </div>

      <button type="button" class="gm-nav gm-next" (click)="siguiente()" *ngIf="imagenes.length > 1">
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="gm-counter" *ngIf="imagenes.length > 1">
        {{ indiceActivo + 1 }} / {{ imagenes.length }}
      </div>
    </div>

    <div class="gm-thumbs" *ngIf="imagenes.length > 1">
      <button
        *ngFor="let img of imagenes; let i = index"
        type="button"
        class="gm-thumb"
        [class.active]="i === indiceActivo"
        (click)="seleccionar(i)">
        <img [src]="img" [alt]="'Imagen ' + (i + 1)">
      </button>
    </div>

  </ng-container>

  <ng-template #sinImagenes>
    <div class="gm-empty">
      <i class="fa-solid fa-image"></i>
      <p>No hay imágenes disponibles para este curso.</p>
    </div>
  </ng-template>

</div>
