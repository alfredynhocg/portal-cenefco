<div class="hero1-section-area about-bg-area">
    <img src="assets/img/bg/header-img1.jpg" alt="" class="header-img1">
    <div class="container">
        <div class="row">
            <div class="col-lg-8 m-auto">
                <div class="hero-heading-area heading1 text-center">
                    <h1>Crear cuenta</h1>
                    <app-breadcrumb title="Crear cuenta" />
                </div>
            </div>
        </div>
    </div>
</div>

<div class="contact1-section-area contact-inner sp1">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="contact-submit-boxarea">

                    @if (error()) {
                        <div class="alert alert-danger" role="alert">
                            {{ error() }}
                        </div>
                    }

                    <h4>Regístrate en CENEFCO</h4>
                    <form (ngSubmit)="registrar()" #f="ngForm">
                        <div class="row">
                            <div class="col-lg-6 col-12">
                                <div class="input-area">
                                    <p>Nombre <span class="text-danger">*</span></p>
                                    <input type="text" placeholder="Tu nombre"
                                           name="nombre" [(ngModel)]="nombre" required>
                                </div>
                            </div>
                            <div class="col-lg-6 col-12">
                                <div class="input-area">
                                    <p>Apellido <span class="text-danger">*</span></p>
                                    <input type="text" placeholder="Tu apellido"
                                           name="apellido" [(ngModel)]="apellido" required>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="input-area">
                                    <p>Correo electrónico <span class="text-danger">*</span></p>
                                    <input type="email" placeholder="tucorreo@ejemplo.com"
                                           name="email" [(ngModel)]="email" required>
                                </div>
                            </div>

                            <div class="col-lg-6 col-12">
                                <div class="input-area">
                                    <p>Contraseña <span class="text-danger">*</span></p>
                                    <input type="password" placeholder="Mínimo 8 caracteres"
                                           name="password" [(ngModel)]="password" required minlength="8">
                                </div>
                            </div>
                            <div class="col-lg-6 col-12">
                                <div class="input-area">
                                    <p>Confirmar contraseña <span class="text-danger">*</span></p>
                                    <input type="password" placeholder="Repite tu contraseña"
                                           name="passwordConfirmation" [(ngModel)]="passwordConfirmation" required>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="input-area1">
                                    <button type="submit" class="header-btn1 w-100 justify-content-center" [disabled]="f.invalid || cargando()">
                                        @if (cargando()) {
                                            Creando cuenta...
                                        } @else {
                                            Crear cuenta <i class="fa-solid fa-arrow-right"></i>
                                        }
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>

                    <div class="auth-divider">
                        <span>o continúa con</span>
                    </div>

                    <div class="d-flex justify-content-center">
                        <div #googleBtn></div>
                    </div>

                    <p class="text-center auth-switch-text">
                        ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
